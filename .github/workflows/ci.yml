name: CI

on:
  push:
    branches: [main]
    paths: &desktop_paths
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'docs/releases/**'
      - 'catalog/**'
  pull_request:
    branches: [main]
    paths: *desktop_paths
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run all tests, including optional visual scans
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected tests
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_tests }}
        run: |
          ./scripts/test-select-test-projects.ps1
          $full = $env:FULL_TESTS -eq 'true'
          $baseline = ''
          if (-not $full) {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20"
            if ($LASTEXITCODE -eq 0) {
              $baseline = ($response | ConvertFrom-Json).workflow_runs |
                Where-Object {
                  $_.head_branch -eq 'main' -and $_.head_repository.full_name -eq $env:GITHUB_REPOSITORY -and
                  $_.event -in @('push', 'workflow_dispatch')
                } | Select-Object -First 1 -ExpandProperty head_sha
            } else {
              Write-Warning 'Could not read the last successful main CI. Running all standard tests.'
            }
          }
          $projects = @(./scripts/select-test-projects.ps1 -Baseline $baseline -Full:$full)
          $modules = @($projects | ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) }) -join ', '
          Add-Content $env:GITHUB_STEP_SUMMARY "Test projects: $modules"
          "projects=$($projects -join ';')" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.plan.outputs.projects != ''
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        if: steps.plan.outputs.projects != ''
        run: dotnet build Crystalfly.slnx -c Release

      - name: Run selected tests
        id: tests
        if: steps.plan.outputs.projects != ''
        shell: pwsh
        env:
          TEST_PROJECTS: ${{ steps.plan.outputs.projects }}
          FULL_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_tests }}
        run: |
          $filter = if ($env:FULL_TESTS -eq 'true') { 'FullyQualifiedName~Crystalfly' } else { 'Category!=VisualScan' }
          $results = Join-Path $env:RUNNER_TEMP 'crystalfly-test-results'
          $failed = foreach ($project in $env:TEST_PROJECTS.Split(';')) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            Write-Host "::group::$name"
            dotnet test $project -c Release --no-build --filter $filter --logger "trx;LogFileName=$name.trx" --results-directory $results --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none | Out-Host
            $exitCode = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($exitCode -ne 0) {
              Write-Host "::error::$name failed. See its test log and result artifact."
              $name
            }
          }
          if ($failed) { throw "Failed test projects: $($failed -join ', ')" }

      - name: Upload failed run diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: |
            ${{ runner.temp }}/crystalfly-test-results/**/*.trx
            ${{ runner.temp }}/crystalfly-test-results/**/*Sequence.xml
          retention-days: 7
