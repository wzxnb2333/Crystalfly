name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'docs/releases/**'
      - 'catalog/**'
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run all modules and optional visual scans
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Crystalfly.slnx

      - name: Build
        run: dotnet build Crystalfly.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_tests }}
        run: |
          ./scripts/test-select-test-projects.ps1
          $changedPaths = @()
          # Include changes from failed or superseded runs, not just the latest commit.
          $baseline = gh run list --workflow ci.yml --branch $env:GITHUB_REF_NAME --status success --limit 1 --json headSha --jq '.[0].headSha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the last successful CI run.' }
          if ($baseline) {
            $changedPaths = @(git diff --name-only $baseline HEAD --)
            if ($LASTEXITCODE -ne 0) { throw 'Could not determine changed paths.' }
          }
          $full = $env:FULL_TESTS -eq 'true'
          $projects = @(./scripts/select-test-projects.ps1 -ChangedPaths $changedPaths -Full:$full)
          $filter = if ($full) { 'FullyQualifiedName~Crystalfly' } else { 'Category!=VisualScan' }
          Write-Host "Selected test projects: $($projects -join ', ')"
          $failed = @()
          foreach ($project in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            $log = Join-Path $env:RUNNER_TEMP "$name.log"
            dotnet test $project -c Release --no-build --filter $filter --blame-hang --blame-hang-timeout 3m 2>&1 |
              Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
              $failContext = Get-Content -LiteralPath $log |
                Select-String -Pattern '\[FAIL\]' -Context 0,40
              foreach ($match in ($failContext | Select-Object -First 20)) {
                $post = $match.Context.PostContext
                $errorLine = ($post | Where-Object { $_ -match 'Error Message:' } | Select-Object -First 1)
                $stack = (($post | Where-Object { $_ -match 'at .*Crystalfly' } | Select-Object -First 5) -join ' ')
                $details = @()
                if ($errorLine) { $details += $errorLine.Trim() }
                if ($stack) { $details += $stack }
                $text = $match.Line.Trim()
                if ($details.Count -gt 0) { $text += ' | ' + ($details -join ' ') }
                if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
                Write-Host ('::error::' + $text)
              }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## $name failed"
              $excerpt = Get-Content -LiteralPath $log |
                Select-String -Pattern '\[FAIL\]|Failed!|错误消息|Error Message|Assert\.' -Context 0,12 |
                Out-String
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + [Environment]::NewLine + $excerpt + [Environment]::NewLine + '```')
            }
          }
          if ($failed.Count -gt 0) {
            throw "Failed test projects: $($failed -join ', ')"
          }
