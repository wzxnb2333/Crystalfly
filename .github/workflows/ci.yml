name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Crystalfly.slnx

      - name: Build
        run: dotnet build Crystalfly.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $projects = @(
            'tests/Crystalfly.Updater.Tests/Crystalfly.Updater.Tests.csproj',
            'tests/Crystalfly.Steam.Tests/Crystalfly.Steam.Tests.csproj',
            'tests/Crystalfly.Core.Tests/Crystalfly.Core.Tests.csproj',
            'tests/Crystalfly.App.Tests/Crystalfly.App.Tests.csproj'
          )
          $failed = @()
          foreach ($project in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            $log = Join-Path $env:RUNNER_TEMP "$name.log"
            dotnet test $project -c Release --no-build --blame-hang --blame-hang-timeout 3m 2>&1 |
              Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## $name failed"
              $excerpt = Get-Content -LiteralPath $log |
                Select-String -Pattern '\[FAIL\]|Failed!|错误消息|Error Message|Assert\.' -Context 0,12 |
                Out-String
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + [Environment]::NewLine + $excerpt + [Environment]::NewLine + '```')
            }
          }
          if ($failed.Count -gt 0) {
            throw "Failed test projects: $($failed -join ', ')"
          }
